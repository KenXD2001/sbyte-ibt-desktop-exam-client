[package]
name = "exam-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "exam_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# OS key lockdown (lockdown.rs) — Windows low-level keyboard hook.
# Plus registry policy lockdown (registry_lockdown.rs) and shell lockdown
# (shell_lockdown.rs): SEB Layers 2/4 — toolhelp process kill, registry
# policy values, Explorer restart.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
